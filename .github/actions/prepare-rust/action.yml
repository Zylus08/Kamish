name: Prepare Rust build inputs
description: Install protoc and build the dashboard embedded by the unified binary.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
      with:
        python-version: '3.12'
    - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22.12.0'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install pinned protobuf compiler
      shell: bash
      run: python scripts/setup_ci_protoc.py
    - name: Build embedded dashboard
      shell: bash
      run: npm --prefix frontend ci && npm --prefix frontend run build
